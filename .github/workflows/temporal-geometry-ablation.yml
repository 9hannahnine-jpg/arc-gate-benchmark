name: Temporal geometry ablation

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  temporal-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scikit-learn datasets sentence-transformers torch
      - name: Run temporal geometry ablation
        run: |
          python temporal_geometry_ablation.py | tee temporal_geometry_stdout.txt
      - uses: actions/upload-artifact@v4
        with:
          name: temporal-geometry-ablation
          path: |
            temporal_geometry_results.json
            temporal_geometry_stdout.txt
